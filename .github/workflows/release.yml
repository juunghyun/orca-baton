name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - name: Test
        run: go vet ./... && go test -race ./...
      - name: Build
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          for arch in arm64 amd64; do
            out="$RUNNER_TEMP/build-$arch"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/juunghyun/orca-baton/internal/baton.Version=${GITHUB_REF_NAME}" \
              -o "$out/baton" ./cmd/baton
            tar -czf "$RUNNER_TEMP/dist/baton-darwin-$arch.tar.gz" -C "$out" baton
            (cd "$RUNNER_TEMP/dist" && shasum -a 256 "baton-darwin-$arch.tar.gz" > "baton-darwin-$arch.tar.gz.sha256")
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/dist/* --title "$GITHUB_REF_NAME" --generate-notes
