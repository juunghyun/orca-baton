name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 가짜 HOME·가짜 claude 로 래퍼·규칙·/swap·HUD·설치를 시험한다.
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tests
        run: go vet ./... && go test -race ./...
      # 새 Mac 처럼: 릴리스와 같은 tar.gz 를 만들어 scripts/install.sh 로 설치 → 재설치 → 제거.
      - name: Fresh install end to end
        run: |
          mkdir -p "$RUNNER_TEMP/b"
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/b/baton" ./cmd/baton
          tgz="$RUNNER_TEMP/baton-darwin.tar.gz"
          tar -czf "$tgz" -C "$RUNNER_TEMP/b" baton
          shasum -a 256 "$tgz" > "$tgz.sha256"
          env -i HOME="$HOME" USER="$USER" PATH=/usr/bin:/bin:/usr/sbin:/sbin SHELL=/bin/zsh \
            LANG=en_US.UTF-8 TERM=xterm-256color REPO="$GITHUB_WORKSPACE" BATON_TGZ="$tgz" \
            /bin/zsh scripts/e2e-install.sh
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 푸시 범위가 아니라 전체 이력을 본다. 범위 검사는 강제 푸시 뒤 없어진 이전 커밋을 찾다 실패한다.
      - name: gitleaks (full history)
        run: |
          curl -sSfL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks git --redact -v --exit-code 1 .
